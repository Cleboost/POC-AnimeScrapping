name: Lib Tests

on:
  push:
    paths:
      - "Lib/**"
      - ".github/workflows/lib-test.yml"
  pull_request:
    paths:
      - "Lib/**"
      - ".github/workflows/lib-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lib

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      - name: Contract tests (APIs live)
        run: bun run test:contract
        timeout-minutes: 15

  browser-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: Lib

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Browser contract tests
        run: bun run test:browser
        env:
          RUN_BROWSER_TESTS: "1"
        timeout-minutes: 20
